name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-verify-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Rebuild committed runtime
        run: pnpm build

      - name: Verify committed runtime is current
        run: git diff --exit-code -- dist
